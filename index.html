<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
  </head>
  <body>
    <!-- Where the output will appear -->
  <div id="status">Loading products...</div>
  <ul id="product-list"></ul>

  <script>
    // 1. Define what you want to do
    async function loadProducts() {
      const statusEl = document.getElementById('status');
      const listEl = document.getElementById('product-list');

      try {
        // 2. Fetch the data and wait for it
        const response = await fetch('https://dummyjson.com/products');
        
        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();
        
        // 3. Clear loading text
        statusEl.textContent = '';

        // 4. Render the items
        listEl.innerHTML = data.products
          .map(product => `<li>${product.title} - $${product.price}</li>`)
          .join('');

      } catch (error) {
        // Handle network failures or errors gracefully
        statusEl.textContent = `Could not load products: ${error.message}`;
      }
    }
    // 5. Initiate the call as soon as HTML is ready
    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
